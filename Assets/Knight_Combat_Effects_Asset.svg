<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 512" width="2048" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181920"/>
      <stop offset="100%" stop-color="#0c0d12"/>
    </linearGradient>

    <!-- Slash Glow Gradient -->
    <linearGradient id="slashGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Dark Flame Gradient -->
    <linearGradient id="darkFlameGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#c026d3" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </linearGradient>

    <!-- Shield Dome Filter -->
    <filter id="shieldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Slash Glow Filter -->
    <filter id="slashGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Impact Glow Filter -->
    <filter id="hitGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ================= PANEL 1: GÂY SÁT THƯƠNG (DEAL DAMAGE) ================= -->
  <g transform="translate(0, 0)">
    <rect width="512" height="512" fill="url(#panelBg)"/>
    <rect x="8" y="8" width="496" height="496" rx="16" fill="none" stroke="#ef4444" stroke-width="2" stroke-opacity="0.4"/>
    
    <!-- Knight Silhouette / Armor Base -->
    <g transform="translate(256, 270) scale(1.1)">
      <!-- Cape -->
      <path d="M-60,-80 Q-120,40 -80,140 Q0,110 80,140 Q120,40 60,-80 Z" fill="#1f242d"/>
      <!-- Body Armor -->
      <path d="M-45,-70 L45,-70 L35,50 L-35,50 Z" fill="#333842" stroke="#4b5563" stroke-width="4"/>
      <!-- Spiked Pauldrons -->
      <polygon points="-75,-70 -45,-90 -40,-50 -65,-40" fill="#475161"/>
      <polygon points="75,-70 45,-90 40,-50 65,-40" fill="#475161"/>
      <!-- Spiked Helmet -->
      <path d="M-25,-125 Q0,-145 25,-125 L25,-80 L-25,-80 Z" fill="#2d333f" stroke="#4b5563" stroke-width="3"/>
      <polygon points="0,-155 -8,-135 8,-135" fill="#64748b"/>
      <polygon points="-22,-145 -18,-125 -6,-128" fill="#64748b"/>
      <polygon points="22,-145 18,-125 6,-128" fill="#64748b"/>
      <!-- Glowing Eye Visor -->
      <rect x="-18" y="-105" width="36" height="6" rx="3" fill="#ef4444" filter="url(#hitGlow)"/>
      <!-- Legs & Greaves -->
      <path d="M-30,50 L-10,50 L-15,130 L-35,130 Z" fill="#252a34"/>
      <path d="M10,50 L30,50 L35,130 L15,130 Z" fill="#252a34"/>
      <!-- Greatsword Blade (Swung in attack pose) -->
      <polygon points="40,-40 180,-140 195,-125 55,-25" fill="#94a3b8" stroke="#cbd5e1" stroke-width="3"/>
    </g>

    <!-- VFX: Runic Slash Arc Effect -->
    <path d="M 60 420 Q 250 150 450 70" stroke="url(#slashGrad)" stroke-width="20" stroke-linecap="round" fill="none" filter="url(#slashGlow)"/>
    <path d="M 80 400 Q 260 160 430 90" stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none"/>
    
    <!-- Spark Burst -->
    <circle cx="430" cy="90" r="10" fill="#fbbf24" filter="url(#slashGlow)"/>
    <circle cx="450" cy="70" r="6" fill="#ffffff"/>
    <line x1="420" y1="100" x2="480" y2="40" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
    <line x1="400" y1="70" x2="450" y2="30" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

    <!-- Banner Tag -->
    <rect x="24" y="24" width="220" height="42" rx="8" fill="#000000" fill-opacity="0.8" stroke="#ef4444" stroke-width="1.5"/>
    <text x="36" y="52" fill="#ef4444" font-family="sans-serif" font-size="20" font-weight="900">1. GÂY SÁT THƯƠNG</text>
  </g>

  <!-- ================= PANEL 2: NHẬN SÁT THƯƠNG (TAKE DAMAGE) ================= -->
  <g transform="translate(512, 0)">
    <rect width="512" height="512" fill="url(#panelBg)"/>
    <rect x="8" y="8" width="496" height="496" rx="16" fill="none" stroke="#f97316" stroke-width="2" stroke-opacity="0.4"/>
    
    <!-- Knight in Hit-Stun (Slightly tilted and red tinted) -->
    <g transform="translate(236, 275) scale(1.1) rotate(-6)">
      <!-- Cape -->
      <path d="M-60,-80 Q-120,40 -80,140 Q0,110 80,140 Q120,40 60,-80 Z" fill="#451a1a"/>
      <!-- Body Armor (Hit Flash Red) -->
      <path d="M-45,-70 L45,-70 L35,50 L-35,50 Z" fill="#7f1d1d" stroke="#ef4444" stroke-width="4"/>
      <!-- Spiked Pauldrons -->
      <polygon points="-75,-70 -45,-90 -40,-50 -65,-40" fill="#991b1b"/>
      <polygon points="75,-70 45,-90 40,-50 65,-40" fill="#991b1b"/>
      <!-- Helmet -->
      <path d="M-25,-125 Q0,-145 25,-125 L25,-80 L-25,-80 Z" fill="#7f1d1d" stroke="#ef4444" stroke-width="3"/>
      <!-- Glowing Red Eye Visor -->
      <rect x="-18" y="-105" width="36" height="6" rx="3" fill="#ffffff" filter="url(#hitGlow)"/>
      <!-- Legs & Greaves -->
      <path d="M-30,50 L-10,50 L-15,130 L-35,130 Z" fill="#5c1d1d"/>
      <path d="M10,50 L30,50 L35,130 L15,130 Z" fill="#5c1d1d"/>
    </g>

    <!-- VFX: Impact Starburst & Shattered Sparks -->
    <g transform="translate(260, 240)">
      <!-- Impact Star -->
      <polygon points="0,-75 22,-22 75,-15 32,25 45,75 0,42 -45,75 -32,25 -75,-15 -22,-22" fill="#ef4444" opacity="0.8" filter="url(#hitGlow)"/>
      <polygon points="0,-45 14,-14 45,-8 20,16 28,45 0,25 -28,45 -20,16 -45,-8 -14,-14" fill="#ffffff" opacity="0.95"/>
      <!-- Flying Armor Sparks -->
      <circle cx="-90" cy="-60" r="5" fill="#fca5a5"/>
      <circle cx="80" cy="-70" r="6" fill="#fca5a5"/>
      <circle cx="-110" cy="40" r="4" fill="#ef4444"/>
      <circle cx="95" cy="55" r="5" fill="#ef4444"/>
      <line x1="-50" y1="-30" x2="-100" y2="-60" stroke="#fca5a5" stroke-width="3"/>
      <line x1="50" y1="-30" x2="105" y2="-65" stroke="#fca5a5" stroke-width="3"/>
    </g>

    <!-- Banner Tag -->
    <rect x="24" y="24" width="240" height="42" rx="8" fill="#000000" fill-opacity="0.8" stroke="#f97316" stroke-width="1.5"/>
    <text x="36" y="52" fill="#f97316" font-family="sans-serif" font-size="20" font-weight="900">2. NHẬN SÁT THƯƠNG</text>
  </g>

  <!-- ================= PANEL 3: NHẬN HIỆU ỨNG KHIÊN (SHIELD BARRIER) ================= -->
  <g transform="translate(1024, 0)">
    <rect width="512" height="512" fill="url(#panelBg)"/>
    <rect x="8" y="8" width="496" height="496" rx="16" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.4"/>
    
    <!-- Knight in Defend Stance -->
    <g transform="translate(256, 270) scale(1.1)">
      <!-- Cape -->
      <path d="M-60,-80 Q-120,40 -80,140 Q0,110 80,140 Q120,40 60,-80 Z" fill="#1f242d"/>
      <!-- Body Armor -->
      <path d="M-45,-70 L45,-70 L35,50 L-35,50 Z" fill="#333842" stroke="#4b5563" stroke-width="4"/>
      <!-- Heavy Iron Kite Shield Raised -->
      <path d="M-55,-60 L20,-60 L15,60 L-18,100 L-50,60 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
      <!-- Shield Emblem -->
      <polygon points="-18,-40 -5,-10 -30,-10" fill="#38bdf8"/>
      <!-- Helmet -->
      <path d="M-25,-125 Q0,-145 25,-125 L25,-80 L-25,-80 Z" fill="#2d333f" stroke="#4b5563" stroke-width="3"/>
      <rect x="-18" y="-105" width="36" height="6" rx="3" fill="#38bdf8" filter="url(#shieldGlow)"/>
    </g>

    <!-- VFX: Runic Hexagonal Forcefield Barrier -->
    <ellipse cx="256" cy="256" rx="200" ry="210" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="6" stroke-dasharray="14 8" filter="url(#shieldGlow)"/>
    <ellipse cx="256" cy="256" rx="190" ry="200" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>

    <!-- Hexagon Array -->
    <g stroke="#38bdf8" stroke-width="2.5" fill="rgba(56, 189, 248, 0.08)">
      <!-- Top Center Hex -->
      <polygon points="256,90 296,113 296,159 256,182 216,159 216,113"/>
      <!-- Mid Left Hex -->
      <polygon points="176,210 216,233 216,279 176,302 136,279 136,233"/>
      <!-- Mid Right Hex -->
      <polygon points="336,210 376,233 376,279 336,302 296,279 296,233"/>
      <!-- Bottom Center Hex -->
      <polygon points="256,330 296,353 296,399 256,422 216,399 216,353"/>
    </g>

    <!-- Banner Tag -->
    <rect x="24" y="24" width="180" height="42" rx="8" fill="#000000" fill-opacity="0.8" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="36" y="52" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="900">3. NHẬN KHIÊN</text>
  </g>

  <!-- ================= PANEL 4: HIỆU ỨNG ĐẶC BIỆT (SPECIAL STATUS BUFF) ================= -->
  <g transform="translate(1536, 0)">
    <rect width="512" height="512" fill="url(#panelBg)"/>
    <rect x="8" y="8" width="496" height="496" rx="16" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.4"/>
    
    <!-- Rising Dark Flames (Background layer) -->
    <path d="M 160 480 Q 120 300 180 180 Q 140 320 200 450 Z" fill="url(#darkFlameGrad)"/>
    <path d="M 350 480 Q 390 300 330 180 Q 370 320 310 450 Z" fill="url(#darkFlameGrad)"/>
    <path d="M 230 490 Q 256 220 260 120 Q 275 260 280 490 Z" fill="url(#darkFlameGrad)"/>

    <!-- Knight in Awakened Pose -->
    <g transform="translate(256, 270) scale(1.1)">
      <!-- Cape -->
      <path d="M-60,-80 Q-120,40 -80,140 Q0,110 80,140 Q120,40 60,-80 Z" fill="#2e1065"/>
      <!-- Body Armor -->
      <path d="M-45,-70 L45,-70 L35,50 L-35,50 Z" fill="#3b0764" stroke="#c084fc" stroke-width="4"/>
      <!-- Helmet -->
      <path d="M-25,-125 Q0,-145 25,-125 L25,-80 L-25,-80 Z" fill="#2e1065" stroke="#a855f7" stroke-width="3"/>
      <!-- Piercing Radiant Eyes -->
      <ellipse cx="0" cy="-105" rx="22" ry="4" fill="#f43f5e" filter="url(#hitGlow)"/>
      <circle cx="-10" cy="-105" r="3" fill="#ffffff"/>
      <circle cx="10" cy="-105" r="3" fill="#ffffff"/>
      <!-- Cursed Greatsword Charged with Dark Power -->
      <polygon points="40,-40 60,-170 75,-165 55,-25" fill="#7e22ce" stroke="#d946ef" stroke-width="4" filter="url(#shieldGlow)"/>
    </g>

    <!-- Orbiting Ancient Runes -->
    <text x="80" y="160" fill="#e879f9" font-family="serif" font-size="34" font-weight="bold" opacity="0.9" filter="url(#hitGlow)">ᚱ</text>
    <text x="390" y="180" fill="#c084fc" font-family="serif" font-size="34" font-weight="bold" opacity="0.9" filter="url(#hitGlow)">ᚨ</text>
    <text x="90" y="340" fill="#a855f7" font-family="serif" font-size="32" font-weight="bold" opacity="0.8" filter="url(#hitGlow)">ᚦ</text>
    <text x="380" y="330" fill="#f43f5e" font-family="serif" font-size="32" font-weight="bold" opacity="0.8" filter="url(#hitGlow)">ᛋ</text>

    <!-- Banner Tag -->
    <rect x="24" y="24" width="260" height="42" rx="8" fill="#000000" fill-opacity="0.8" stroke="#a855f7" stroke-width="1.5"/>
    <text x="36" y="52" fill="#c084fc" font-family="sans-serif" font-size="20" font-weight="900">4. HIỆU ỨNG ĐẶC BIỆT</text>
  </g>
</svg>
