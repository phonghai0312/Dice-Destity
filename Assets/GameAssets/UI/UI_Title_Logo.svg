<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Metallic Silver/Platinum Gradient for Title -->
    <linearGradient id="metalBevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#e2e8f0"/>
      <stop offset="45%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="80%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Golden Accent Gradient -->
    <linearGradient id="goldAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Crimson/Purple Rune Glow Filter -->
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="heavyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- BACKGROUND ORNAMENTAL RUNE CIRCLE -->
  <g transform="translate(600, 150)" opacity="0.4" filter="url(#purpleGlow)">
    <circle r="120" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="8 6"/>
    <circle r="110" fill="none" stroke="#c084fc" stroke-width="1.5"/>
    <polygon points="0,-110 95,55 -95,55" fill="none" stroke="#a855f7" stroke-width="1.5"/>
    <polygon points="0,110 95,-55 -95,-55" fill="none" stroke="#a855f7" stroke-width="1.5"/>
  </g>

  <!-- FLANKING RUNIC DICE ICONS -->
  <!-- Left Die -->
  <g transform="translate(190, 150) rotate(-15)" filter="url(#goldGlow)">
    <rect x="-30" y="-30" width="60" height="60" rx="10" fill="#181124" stroke="url(#goldAccent)" stroke-width="3"/>
    <!-- Die Dots / Rune Symbol -->
    <circle cx="0" cy="0" r="6" fill="#f59e0b"/>
    <circle cx="-16" cy="-16" r="4.5" fill="#fef08a"/>
    <circle cx="16" cy="16" r="4.5" fill="#fef08a"/>
    <circle cx="-16" cy="16" r="4.5" fill="#fef08a"/>
    <circle cx="16" cy="-16" r="4.5" fill="#fef08a"/>
  </g>

  <!-- Right Die -->
  <g transform="translate(1010, 150) rotate(15)" filter="url(#goldGlow)">
    <rect x="-30" y="-30" width="60" height="60" rx="10" fill="#181124" stroke="url(#goldAccent)" stroke-width="3"/>
    <circle cx="0" cy="0" r="6" fill="#f59e0b"/>
    <circle cx="-15" cy="-15" r="5" fill="#fef08a"/>
    <circle cx="15" cy="15" r="5" fill="#fef08a"/>
  </g>

  <!-- MAIN TITLE: "DICE & DESTINY" -->
  <!-- Drop Shadow Layer -->
  <text x="600" y="185" text-anchor="middle" font-family="'Cinzel', 'Georgia', 'Palatino', serif" font-size="108" font-weight="900" letter-spacing="8" fill="#000000" filter="url(#heavyShadow)">DICE &amp; DESTINY</text>
  <!-- Deep Bevel Base -->
  <text x="600" y="182" text-anchor="middle" font-family="'Cinzel', 'Georgia', 'Palatino', serif" font-size="108" font-weight="900" letter-spacing="8" fill="#0f172a" stroke="#000000" stroke-width="10">DICE &amp; DESTINY</text>
  <!-- Metallic Surface -->
  <text x="600" y="180" text-anchor="middle" font-family="'Cinzel', 'Georgia', 'Palatino', serif" font-size="108" font-weight="900" letter-spacing="8" fill="url(#metalBevel)" stroke="url(#goldAccent)" stroke-width="2.5" filter="url(#heavyShadow)">DICE &amp; DESTINY</text>

  <!-- SLOGAN RIBBON / BANNER UNDERNEATH -->
  <g transform="translate(600, 260)">
    <!-- Flanking Filigree Lines -->
    <line x1="-360" y1="0" x2="-220" y2="0" stroke="url(#goldAccent)" stroke-width="2"/>
    <circle cx="-220" cy="0" r="4" fill="#f59e0b"/>
    <line x1="220" y1="0" x2="360" y2="0" stroke="url(#goldAccent)" stroke-width="2"/>
    <circle cx="220" cy="0" r="4" fill="#f59e0b"/>

    <!-- Center Gem Diamond -->
    <polygon points="0,-10 10,0 0,10 -10,0" fill="#f43f5e" stroke="#ffe4e6" stroke-width="1.5" filter="url(#purpleGlow)"/>
    <circle cx="0" cy="0" r="3" fill="#fef08a"/>

    <!-- Slogan Text (Bold Chiseled Gold with Dark Outline) -->
    <text x="0" y="8" text-anchor="middle" font-family="'Cinzel', 'Georgia', 'Palatino', serif" font-size="24" font-weight="900" letter-spacing="8" fill="#000000" stroke="#000000" stroke-width="6" stroke-linejoin="round" filter="url(#heavyShadow)">ROLL YOUR FATE • DEFY THE ABYSS</text>
    <text x="0" y="8" text-anchor="middle" font-family="'Cinzel', 'Georgia', 'Palatino', serif" font-size="24" font-weight="900" letter-spacing="8" fill="url(#goldAccent)" stroke="url(#goldAccent)" stroke-width="0.8" filter="url(#goldGlow)">ROLL YOUR FATE • DEFY THE ABYSS</text>
    
    <!-- Subtitle Vietnamese Translation -->
    <text x="0" y="36" text-anchor="middle" font-family="'Segoe UI', 'Arial', sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#000000" stroke="#000000" stroke-width="2.5">ĐỊNH ĐOẠT VẬN MỆNH BẰNG XÚC XẮC</text>
    <text x="0" y="36" text-anchor="middle" font-family="'Segoe UI', 'Arial', sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#cbd5e1" opacity="0.95">ĐỊNH ĐOẠT VẬN MỆNH BẰNG XÚC XẮC</text>
  </g>
</svg>

