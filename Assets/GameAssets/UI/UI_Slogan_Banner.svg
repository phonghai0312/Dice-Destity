<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120">
  <defs>
    <!-- Rich Golden Gradient -->
    <linearGradient id="goldTextGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="90%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Metallic Gold Stroke -->
    <linearGradient id="goldStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Crimson/Purple Rune Glow Filter -->
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Deep Drop Shadow -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- SLOGAN RIBBON / BANNER -->
  <g transform="translate(500, 52)">
    <!-- Decorative Filigree Wings -->
    <g filter="url(#goldGlow)">
      <!-- Left Wing -->
      <line x1="-460" y1="0" x2="-310" y2="0" stroke="url(#goldStroke)" stroke-width="2.5"/>
      <polygon points="-310,-6 -296,0 -310,6" fill="#f59e0b"/>
      <circle cx="-460" cy="0" r="4" fill="#f59e0b"/>

      <!-- Right Wing -->
      <line x1="310" y1="0" x2="460" y2="0" stroke="url(#goldStroke)" stroke-width="2.5"/>
      <polygon points="310,-6 296,0 310,6" fill="#f59e0b"/>
      <circle cx="460" cy="0" r="4" fill="#f59e0b"/>
    </g>

    <!-- Center Gem Diamond -->
    <g filter="url(#purpleGlow)">
      <polygon points="0,-12 12,0 0,12 -12,0" fill="#f43f5e" stroke="#ffe4e6" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="3.5" fill="#fef08a"/>
    </g>

    <!-- Main Slogan: ROLL YOUR FATE • DEFY THE ABYSS -->
    <!-- Layer 1: Heavy Black Shadow & Outline for 100% Legibility -->
    <text x="0" y="8" text-anchor="middle" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="28" font-weight="900" letter-spacing="8" fill="#000000" stroke="#000000" stroke-width="7" stroke-linejoin="round" filter="url(#textShadow)">ROLL YOUR FATE • DEFY THE ABYSS</text>
    
    <!-- Layer 2: Beveled Gold Text -->
    <text x="0" y="8" text-anchor="middle" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="28" font-weight="900" letter-spacing="8" fill="url(#goldTextGrad)" stroke="url(#goldStroke)" stroke-width="1" filter="url(#goldGlow)">ROLL YOUR FATE • DEFY THE ABYSS</text>

    <!-- Vietnamese Translation Subtitle -->
    <text x="0" y="40" text-anchor="middle" font-family="'Segoe UI', 'Arial', sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#000000" stroke="#000000" stroke-width="3">ĐỊNH ĐOẠT VẬN MỆNH BẰNG XÚC XẮC</text>
    <text x="0" y="40" text-anchor="middle" font-family="'Segoe UI', 'Arial', sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#cbd5e1" opacity="0.95">ĐỊNH ĐOẠT VẬN MỆNH BẰNG XÚC XẮC</text>
  </g>
</svg>
