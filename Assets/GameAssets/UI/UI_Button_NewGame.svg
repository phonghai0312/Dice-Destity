<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="460" height="90">
  <defs>
    <linearGradient id="btnPlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241e2b"/>
      <stop offset="50%" stop-color="#15121b"/>
      <stop offset="100%" stop-color="#0a080d"/>
    </linearGradient>

    <linearGradient id="btnBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#d97706"/>
      <stop offset="70%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <linearGradient id="textGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="btnShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Button Base Plate -->
  <g filter="url(#btnShadow)">
    <!-- Outer Cut-Corner Frame -->
    <polygon points="18,5 442,5 455,18 455,72 442,85 18,85 5,72 5,18" fill="url(#btnPlate)" stroke="url(#btnBorder)" stroke-width="2.5"/>
    
    <!-- Inner Fine Border -->
    <polygon points="22,11 438,11 449,22 449,68 438,79 22,79 11,68 11,22" fill="none" stroke="#6b21a8" stroke-width="1.2" opacity="0.8"/>

    <!-- 4 Corner Gothic Studs / Brackets -->
    <polygon points="5,18 18,5 25,12 12,25" fill="#f59e0b"/>
    <polygon points="455,18 442,5 435,12 448,25" fill="#f59e0b"/>
    <polygon points="5,72 18,85 25,78 12,65" fill="#f59e0b"/>
    <polygon points="455,72 442,85 435,78 448,65" fill="#f59e0b"/>

    <!-- Left & Right Accent Rune Diamonds -->
    <polygon points="32,45 38,39 44,45 38,51" fill="#f43f5e" filter="url(#goldGlow)"/>
    <polygon points="428,45 422,39 416,45 422,51" fill="#f43f5e" filter="url(#goldGlow)"/>

    <!-- Text: NEW GAME -->
    <text x="230" y="55" text-anchor="middle" font-family="'Cinzel', 'Georgia', 'Palatino', serif" font-size="28" font-weight="900" letter-spacing="5" fill="#000000" opacity="0.9">NEW GAME</text>
    <text x="230" y="53" text-anchor="middle" font-family="'Cinzel', 'Georgia', 'Palatino', serif" font-size="28" font-weight="900" letter-spacing="5" fill="url(#textGold)" filter="url(#goldGlow)">NEW GAME</text>
  </g>
</svg>

